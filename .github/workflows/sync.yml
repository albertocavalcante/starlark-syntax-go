name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate only, no push)'
        type: boolean
        default: false
      init_history:
        description: 'Initialize history (first-time sync)'
        type: boolean
        default: false
      force:
        description: 'Force push (dangerous)'
        type: boolean
        default: false

# NOTE: We use Eukia App token for all git operations (push, tag creation).
# The App token has its own permissions granted by the GitHub App installation.
# Setting contents: write here for clarity, though the App token overrides this.
permissions:
  contents: write

env:
  COPYBARA_VERSION: "20251215"

jobs:
  sync:
    name: Sync Upstream Sources
    runs-on: ubuntu-latest
    steps:
      - name: Generate Eukia App Token
        id: eukia
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.EUKIA_APP_ID }}
          private-key: ${{ secrets.EUKIA_APP_PRIVATE_KEY }}
          owner: albertocavalcante
          repositories: starlark-syntax-go

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.eukia.outputs.token }}

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Copybara JAR
        id: cache-copybara
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: /tmp/copybara_deploy.jar
          key: copybara-${{ env.COPYBARA_VERSION }}

      - name: Download Copybara
        if: steps.cache-copybara.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/copybara_deploy.jar \
            "https://github.com/google/copybara/releases/download/v${COPYBARA_VERSION}/copybara_deploy.jar"

      - name: Configure Git
        run: |
          git config --global user.name "Eukia[bot]"
          git config --global user.email "eukia[bot]@users.noreply.github.com"
          git config --global credential.helper store
          echo "https://x-access-token:${{ steps.eukia.outputs.token }}@github.com" > ~/.git-credentials

      - name: Run Copybara (Validate)
        if: ${{ inputs.dry_run == true }}
        run: |
          java -jar /tmp/copybara_deploy.jar validate \
            .copybara/copy.bara.sky

      - name: Build Copybara flags
        id: flags
        if: ${{ inputs.dry_run != true }}
        run: |
          FLAGS=""
          if [[ "${{ inputs.init_history }}" == "true" ]]; then
            FLAGS="$FLAGS --init-history"
          fi
          if [[ "${{ inputs.force }}" == "true" ]]; then
            FLAGS="$FLAGS --force"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Sync Bzl Parser
        if: ${{ inputs.dry_run != true }}
        run: |
          java -jar /tmp/copybara_deploy.jar migrate \
            .copybara/copy.bara.sky \
            sync-bzl-parser \
            --ignore-noop \
            ${{ steps.flags.outputs.flags }}

      - name: Sync Starlark Parser
        if: ${{ inputs.dry_run != true }}
        run: |
          java -jar /tmp/copybara_deploy.jar migrate \
            .copybara/copy.bara.sky \
            sync-starlark-parser \
            --ignore-noop \
            ${{ steps.flags.outputs.flags }}

  generate-version:
    name: Generate VERSION.json
    runs-on: ubuntu-latest
    needs: sync
    if: ${{ inputs.dry_run != true }}
    steps:
      - name: Generate Eukia App Token
        id: eukia
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.EUKIA_APP_ID }}
          private-key: ${{ secrets.EUKIA_APP_PRIVATE_KEY }}
          owner: albertocavalcante
          repositories: starlark-syntax-go

      # IMPORTANT: Use ref: main to get latest commits from sync job.
      # Without this, checkout would use the SHA that triggered the workflow,
      # missing any commits pushed by the sync job (race condition).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          token: ${{ steps.eukia.outputs.token }}

      - name: Generate VERSION.json
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');

            // Fetch actual commit SHAs from upstream repos
            const [buildtools, starlarkGo] = await Promise.all([
              github.rest.repos.getBranch({ owner: 'bazelbuild', repo: 'buildtools', branch: 'main' }),
              github.rest.repos.getBranch({ owner: 'google', repo: 'starlark-go', branch: 'master' }),
            ]);

            const version = {
              generated_at: new Date().toISOString(),
              generator: "github-actions",
              sources: {
                buildtools: {
                  repository: "github.com/bazelbuild/buildtools",
                  ref: "main",
                  sha: buildtools.data.commit.sha,
                },
                "starlark-go": {
                  repository: "github.com/google/starlark-go",
                  ref: "master",
                  sha: starlarkGo.data.commit.sha,
                }
              },
              packages: {
                "bzl": "Bzl dialect parser (Apache 2.0)",
                "bzl/labels": "Bazel label utilities (Apache 2.0)",
                "starlark": "Official Google Starlark parser (BSD-3)"
              }
            };

            fs.writeFileSync('VERSION.json', JSON.stringify(version, null, 2) + '\n');
            console.log('Generated VERSION.json:', JSON.stringify(version, null, 2));

      - name: Commit VERSION.json
        run: |
          git config user.name "Eukia[bot]"
          git config user.email "eukia[bot]@users.noreply.github.com"
          git add VERSION.json
          git diff --staged --quiet || git commit -m "chore: update VERSION.json"
          git push

  validate:
    name: Validate Build
    runs-on: ubuntu-latest
    needs: generate-version
    steps:
      # IMPORTANT: Use ref: main to get latest commits including VERSION.json.
      # Without this, checkout would use the SHA that triggered the workflow,
      # missing commits from sync and generate-version jobs (race condition).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.24'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  release:
    name: Create Release Tag
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.dry_run != true }}
    steps:
      - name: Generate Eukia App Token
        id: eukia
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.EUKIA_APP_ID }}
          private-key: ${{ secrets.EUKIA_APP_PRIVATE_KEY }}
          owner: albertocavalcante
          repositories: starlark-syntax-go

      # IMPORTANT: Use ref: main to tag the latest commit (including VERSION.json).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          token: ${{ steps.eukia.outputs.token }}

      - name: Create release tag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ steps.eukia.outputs.token }}
          script: |
            const date = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const tag = `v0.${date}.0`;

            try {
              await github.rest.git.getRef({
                owner: 'albertocavalcante',
                repo: 'starlark-syntax-go',
                ref: `tags/${tag}`
              });
              console.log(`Tag ${tag} already exists, skipping`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const { data: ref } = await github.rest.git.getRef({
              owner: 'albertocavalcante',
              repo: 'starlark-syntax-go',
              ref: 'heads/main'
            });

            await github.rest.git.createRef({
              owner: 'albertocavalcante',
              repo: 'starlark-syntax-go',
              ref: `refs/tags/${tag}`,
              sha: ref.object.sha
            });

            console.log(`Created tag ${tag}`);
